# To use this:
# cp template.packages.custom-00-template.yaml packages.custom-<2_numbers>-<some-name>.yaml
# - Example: cp template.packages.custom-00-template.yaml packages.custom-10-mystuff.yaml
#
# All entries support version-specific and architecture-specific configuration:
# - 'all' applies to all Fedora versions and architectures
# - Specific versions (e.g., '42', '43') apply only to those versions
# - Architecture suffixes: 'all_aarch64', 'all_x86_64'
# - Combined: '42_aarch64', '43_x86_64', etc.
# Put architecture suffixes on these inner keys, not on section names.
# Build options go on section names, e.g. rpm_url_gui with all_x86_64.
# - On arch-bootc the version is 'arch' (e.g. 'arch:', 'arch_x86_64:')
#
# Backends (see docs/backends.org):
# - rpm*     native packages, fedora-bootc
# - pacman*  native packages, arch-bootc
# - freebsd* native packages, freebsd-be
# - pkg*     logical packages for every backend: a plain name, or
#            {name: <default>, rpm: <x>, pacman: <y>, freebsd: <z>} where an
#            override may be a list or null (not on that backend)
# - service entries may be {name: <unit>, rc: <rc script or null>}
# pkg*, pacman*, freebsd* and {name:, rc:} services need a base image built
# from Immutablue's multi-backend design; older base images read rpm* only.
