# Packages yaml filename should be in the format of
# packages-custom-<2-numbers>-<description>.yaml 
# - Example: packages-custom-10-my-containers.yaml
# It is **IMPORTANT** to note that these are ran in alphanumeric order.
# (same order that you would get if you did `ls -l ./packages`)
# Meaning, if you are attempting to modify already existing distrobox
# containers for example. Understand the ordering of how they are ran.

# Immutablue section, which applies to **YOUR** build of 
# immutablue
immutablue:
  # Repo URLs to add in the build (they are curled)
  repo_urls:
  # - name: tailscale.repo 
  #   url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
  # - name: hyprland.repo 
  #   url: https://copr.fedorainfracloud.org/coprs/solopasha/hyprland/repo/fedora-41/solopasha-hyprland-fedora-41.repo
  - name: ublue-os-staging.repo
    url: https://copr.fedorainfracloud.org/coprs/ublue-os/staging/repo/fedora-41/ublue-os-staging-fedora-41.repo
  # - name: docker-ce.repo 
  #   url: https://download.docker.com/linux/fedora/docker-ce.repo

  repo_urls_aarch64:
  - name: rust-epel.repo 
    url: https://copr.fedorainfracloud.org/coprs/cyqsimon/el-rust-pkgs/repo/epel-9/cyqsimon-el-rust-pkgs-epel-9.repo


  # RPM packages you want to install
  # Same name as anything you'd normally install with `dnf install <name>`
  rpm:
  - lxc
  - lxc-templates
  # - gdb
  - strace
  - ltrace
  - bpftrace
  - arm-image-installer
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-dash-to-dock
  - gnome-shell-extension-gsconnect
  # - gnome-shell-extension-user-theme
  - gnome-shell-extension-search-light 
  - tlp
  # - hyprland
  # - hyprland-plugins 
  # - hyprlock
  # - hyprpaper
  - wireguard-tools
  - kitty
  - qtile-wayland
  - rofi
  - muvm

  rpm_aarch64:
  - stow
  - neovim
  - htop 
  - tmux 
  - just
  - kubernetes-client
  - helm
  - fastfetch
  - calc
  - coreutils
  - moreutils
  - fzf 
  - glances
  - ncdu
  - ranger
  - ripgrep 
  - tig
  - zenity
  - ruby
  - pass
  - dysk
  - newsboat
  - poppler 

  rpm_asahi_aarch64:
  - steam


  # Urls to RPMs to download (they are curled)
  # so provide the url
  rpm_url:
  #- https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-41.noarch.rpm 
  #- https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-41.noarch.rpm

  # RPM packages you want to remove from the image
  rpm_rm:
  - gnome-software-rpm-ostree

  # Build files that need to be removed. If the build is filing about some
  # ephemeral file that exists, put the path here so it get removed in 
  # the later build stages
  file_rm:
  # - /path/to/some/file

  # Runtimes for Flatpaks
  # (Can query with `flatpak list --app --columns=application,runtime`)
  # Really only needed if you plan to build an iso
  flatpaks_runtime:
  
  
  # Flatpaks to be installed
  flatpaks:
  - org.gnome.Platform//46
  - com.bitwarden.desktop
  - com.calibre_ebook.calibre
  - com.gitfiend.GitFiend
  - org.pulseaudio.pavucontrol
  - re.sonny.Junction
  - org.onionshare.OnionShare
  - org.wireshark.Wireshark
  - org.kiwix.desktop
  - org.jamovi.jamovi
  - io.github.peazip.PeaZip 
  - me.timschneeberger.GalaxyBudsClient


  #Flatpaks to be uninstalled 
  flatpaks_rm:
  # - org.chromium.chromium 

distrobox:
  # Create upstream -- Adding tweaks
- name: util
  image:
  pkg_inst_cmd: dnf install -y
  pkg_updt_cmd: dnf update -y
  extra_commands:
  packages:
  # Both needed for GTK theme stuff
  - sassc
  - glib2-devel
  - gnome-tweaks
  - xfreerdp
  - figlet 
  - cowsay
  - python3-pip
  package_aarch64:
  - home-assistant-cli
  npm_packages:
  pip_packages: 
  cargo_packages:
  bin_export: 
  - figlet 
  - cowsay
  bin_export_aarch64:
  - hass-cli
  app_export: 
  bin_symlink:
 
  # Created upstream -- But adding my tweaks
- name: dev
  image:
  pkg_inst_cmd: dnf install -y
  pkg_updt_cmd: dnf update -y

  # Setup VS Code Repo - https://code.visualstudio.com/docs/setup/linux
  # Setup ffmpeg for supporting MTP - https://computingforgeeks.com/how-to-install-ffmpeg-on-fedora/
  extra_commands: |
    sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && \
    sudo sh -c 'echo -e "[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc" > /etc/yum.repos.d/vscode.repo' && \
    sudo dnf -y install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm && \
    sudo dnf -y install https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm;

  # Added packages from upstream
  packages:
  - which
  - gdb 
  - R 
  - clang 
  - clang-tools-extra 
  - code 
  - json-glib-devel 
  - nautilus-devel 
  - nautilus-extensions 
  - gtk4-devel 
  - fira-code-fonts 
  - ffmpeg 
  - bpftool 
  - libbpf 
  - libbpf-devel 
  - libbpf-tools 
  - bcc-tools 
  - ShellCheck
  # youtube-tui reqirements: mpv and sixel
  - mpv-devel
  - libsixel
  npm_packages:
  - bash-language-server
  - dockerfile-language-server-nodejs
  - pyright
  pip_packages: 
  # See https://github.com/Freed-Wu/autotools-language-server/issues/9
  - tree-sitter==0.21.3
  - autotools-language-server
  cargo_packages:
  # https://github.com/guilhermeprokisch/smd
  - smd
  - wthrr
  - youtube-tui
  - lowfi
  - sendme
  cargo_packages_aarch64:
  - yazi
  bin_export: 
  - autotools-language-server 
  - bash-language-server
  - docker-langserver 
  - pyright-langserver 
  - clangd 
  - R 
  - Rscript
  - shellcheck
  - youtube-tui
  app_export: 
  bin_symlink:
  - podman 
  - buildah 
  - distrobox 
  - strace 
  - ltrace 
  - bpftrace 

