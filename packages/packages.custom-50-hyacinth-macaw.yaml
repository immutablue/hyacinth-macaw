- name: mpd 
  image: registry.fedoraproject.org/fedora:42 
  root: false 
  additional_flags:
  pkg_inst_cmd: dnf install -y
  pkg_updt_cmd: dnf update -y
  extra_commands: |
    sudo dnf -y install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm && \
    [ "" == "$(grep max_parallel_downloads /etc/dnf/dnf.conf)" ] && sudo bash -c 'echo "max_parallel_downloads=10" >> /etc/dnf/dnf.conf';
  packages:
  - which
  - mpc
  - mpd 
  - ncmpcpp
  npm_packages:
  pip_packages:
  bin_export:
  - mpc
  - mpd 
  - ncmpcpp
  app_export:
  bin_symlink:
  
- name: whisper
  image: quay.io/immutablue/dbox-fedora:42
  pkg_inst_cmd: dnf5 install -y
  pkg_updt_cmd: dnf5 update -y
  extra_commands: |
    #!/bin/bash 
    install_dir="${HOME}/Source/Public/whisper.cpp"
    sudo dnf5 update -y 
    sudo dnf install -y '@development-tools' git cmake gcc-c++ make
    if [[ ! -d "${install_dir}" ]]
    then
      git clone https://github.com/ggerganov/whisper.cpp.git "${install_dir}"
      cd "${install_dir}"
      ./models/download-ggml-model.sh base.en 
      cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      cmake --build build -j
      distrobox-export --bin "${install_dir}/build/bin/whisper-cli"
    fi
  packages:
  - which
  - libsixel
  - ImageMagick
  - ImageMagick-devel
  npm_packages:
  pip_packages: 
  cargo_packages:
  bin_export: 
  app_export: 
  bin_symlink:
  - podman 
  - buildah 
  - distrobox 
  - strace 
  - ltrace 
  - bpftrace 

