  - libsixel
  - ImageMagick
  - ImageMagick-devel
  - cabal-install
  - gtk-docs
  npm_packages:
  - '@anthropic-ai/claude-code'
  - bash-language-server
  - dockerfile-language-server-nodejs
  - pyright
  - perlnavigator-server
  pip_packages: 
  # See https://github.com/Freed-Wu/autotools-language-server/issues/9
  - tree-sitter==0.21.3
  - autotools-language-server
  - feedparser
  - psycopg 
  - psycopg_binary 
  - numpy
  cargo_packages:
  # https://github.com/guilhermeprokisch/smd
  - smd
  - wthrr
  - youtube-tui
  - lowfi
  - sendme
  cargo_packages_aarch64:
  - yazi
  bin_export: 
  - autotools-language-server 
  - bash-language-server
  - docker-langserver 
  - pyright-langserver 
  - perlnavigator
  - clangd 
  - R 
  - Rscript
  - shellcheck
  - youtube-tui
  - /usr/bin/pandoc
  app_export: 
  bin_symlink:
  - podman 
  - buildah 
  - distrobox 
  - strace 
  - ltrace 
  - bpftrace 

