# Packages yaml filename should be in the format of
# packages-custom-<2-numbers>-<description>.yaml 
# - Example: packages-custom-10-my-containers.yaml
# It is **IMPORTANT** to note that these are ran in alphanumeric order.
# (same order that you would get if you did `ls -l ./packages`)
# Meaning, if you are attempting to modify already existing distrobox
# containers for example. Understand the ordering of how they are ran.

# Immutablue section, which applies to **YOUR** build of 
# immutablue
immutablue:
  # Repo URLs to add in the build (they are curled)
  repo_urls:
    all:
    # - name: hyprland.repo
    #   url: https://copr.fedorainfracloud.org/coprs/solopasha/hyprland/repo/fedora-42/solopasha-hyprland-fedora-42.repo
    # 42:
    # - name: ublue-os-staging.repo
    #   url: https://copr.fedorainfracloud.org/coprs/ublue-os/staging/repo/fedora-42/ublue-os-staging-fedora-42.repo
    # 43:
    # - name: ublue-os-staging.repo
    #   url: https://copr.fedorainfracloud.org/coprs/ublue-os/staging/repo/fedora-43/ublue-os-staging-fedora-43.repo
    # - name: gnome-x11.repo 
    #   url: https://copr.fedorainfracloud.org/coprs/frantisekz/GNOME-X11/repo/fedora-43/frantisekz-GNOME-X11-fedora-43.repo
    44:
    - name: claude-desktop-unofficial.repo
      url: https://pkg.claude-desktop-debian.dev/rpm/claude-desktop-unofficial.repo
    # - name: ublue-os-staging.repo
    #   url: https://copr.fedorainfracloud.org/coprs/ublue-os/staging/repo/fedora-43/ublue-os-staging-fedora-44.repo

    all_aarch64:
    - name: rust-epel.repo
      url: https://copr.fedorainfracloud.org/coprs/cyqsimon/el-rust-pkgs/repo/epel-9/cyqsimon-el-rust-pkgs-epel-9.repo


  # gui tools
  # Logical packages, resolved for the base image's backend
  # (fedora-bootc: rpm, arch-bootc: pacman, freebsd-be: freebsd). An entry is
  # the Fedora name, or {name: <fedora>, pacman: <arch>, freebsd: <freebsd>}
  # where a name differs; null = not available on that backend (AUR-only on
  # Arch counts as not available). Fedora-only packages, and those from
  # Fedora-only third-party repos (Proton, claude-desktop), stay in the
  # native rpm* lists below. Names checked 2026-10-29 against Arch's
  # official repos and FreeBSD:15:amd64/quarterly.
  pkg:
    all:
    - binutils
    - {name: borgbackup, pacman: borg, freebsd: py312-borgbackup}
    - {name: cabal-install, freebsd: hs-cabal-install}
    - {name: cockpit, freebsd: null}   # cockpit is Linux-only (systemd, cgroups)
    - {name: cockpit-machines, freebsd: null}   # no cockpit on FreeBSD
    - {name: cockpit-podman, freebsd: null}   # no cockpit on FreeBSD
    - {name: cockpit-ostree, pacman: null, freebsd: null}   # rpm-ostree UI; Fedora-only
    - gcc
    # g++ and the plugin headers ship with gcc on Arch and FreeBSD
    - {name: gcc-c++, pacman: null, freebsd: null}   # in gcc there
    - gdb
    - gnutls
    - {name: gnutls-utils, pacman: null, freebsd: null}   # part of gnutls there
    - {name: ltrace, freebsd: null}   # Linux-only (ptrace + ELF/glibc); FreeBSD: truss/dtrace
    - {name: lxc, freebsd: null}   # Linux containers; FreeBSD has jails
    - {name: lxc-templates, pacman: null, freebsd: null}   # Arch: templates ship in lxc
    - {name: perl-JSON, pacman: perl-json, freebsd: p5-JSON}
    - {name: perl-Mojolicious, pacman: null, freebsd: p5-Mojolicious}   # AUR on Arch
    - {name: perl-YAML, pacman: perl-yaml, freebsd: p5-YAML}
    - rclone
    - {name: stack, freebsd: hs-stack}
    - {name: strace, freebsd: null}   # FreeBSD: truss(1) in base
    - wireguard-tools
    - {name: libzim-devel, pacman: libzim, freebsd: libzim}
    - {name: tesseract-devel, pacman: tesseract, freebsd: tesseract}
    - {name: leptonica-devel, pacman: leptonica, freebsd: leptonica}
    - {name: tesseract-langpack-eng, pacman: tesseract-data-eng, freebsd: tesseract-data}
    - {name: pandoc, pacman: pandoc-cli, freebsd: hs-pandoc}
    - aria2
    - parallel
    all_x86_64:
    # Arch's ROCm installs under /opt, which an arch-bootc image makes a
    # symlink into /var (the bootc layout), and pacman refuses to write
    # through it ("/opt exists in filesystem"); Fedora's lives under /usr.
    # FreeBSD has no ROCm at all (the amdgpu KFD compute driver is Linux-only).
    - {name: rocm-clinfo, pacman: clinfo, freebsd: null}   # no ROCm on FreeBSD (amdgpu KFD is Linux-only)
    - {name: rocm-hip, pacman: null, freebsd: null}
    - {name: rocm-opencl, pacman: null, freebsd: null}
    - {name: rocm-runtime, pacman: null, freebsd: null}
    - {name: rocm-smi, pacman: null, freebsd: null}

  pkg_gui:
    all:
    - arandr
    - {name: brightnessctl, freebsd: null}   # Linux sysfs; FreeBSD: backlight(8) in base
    - feh
    - {name: fluid-soundfont-gm, pacman: soundfont-fluid, freebsd: fluid-soundfont}
    - {name: gnome-shell-extension-appindicator, freebsd: null}   # not in FreeBSD quarterly
    - {name: gnome-shell-extension-blur-my-shell, pacman: null, freebsd: null}   # AUR on Arch; no FreeBSD port
    - {name: gnome-shell-extension-dash-to-dock, pacman: null, freebsd: gnome-shell-extension-dashtodock}   # AUR on Arch
    - {name: gnome-shell-extension-gsconnect, pacman: null, freebsd: null}   # AUR on Arch; no FreeBSD port
    - {name: gnome-shell-extension-user-theme, pacman: gnome-shell-extensions, freebsd: gnome-shell-extensions}
    - grim
    - {name: gtk2-devel, pacman: null, freebsd: gtk2}   # Arch moved gtk2 to the AUR
    - i3lock
    - isync
    - {name: kitty, freebsd: null}   # not in FreeBSD quarterly
    - {name: libX11-devel, pacman: libx11, freebsd: libX11}
    - {name: libXft-devel, pacman: libxft, freebsd: libXft}
    - {name: libXinerama-devel, pacman: libxinerama, freebsd: libXinerama}
    - {name: libXrandr-devel, pacman: libxrandr, freebsd: libXrandr}
    - {name: libXScrnSaver-devel, pacman: libxss, freebsd: libXScrnSaver}
    - {name: maildir-utils, pacman: null, freebsd: mu}   # mu is AUR on Arch
    - msmtp
    - mupdf
    - pcmanfm
    - {name: pcmanfm-devel, pacman: null, freebsd: null}   # headers ship in pcmanfm there
    - picom
    # Fedora: from Proton's repo (rpm_url); Arch: extra
    - {name: proton-vpn-gtk-app, freebsd: null}   # no FreeBSD port (NetworkManager-based)
    - qpdf
    - {name: qpdf-devel, pacman: null, freebsd: null}   # headers ship in qpdf there
    - {name: qtile-wayland, pacman: qtile, freebsd: py312-qtile}
    - rofi
    - swappy
    - {name: waydroid, freebsd: null}   # needs Linux binder/LXC
    - {name: weasyprint, pacman: python-weasyprint, freebsd: null}   # not in FreeBSD quarterly
    - wofi
    - {name: wmctrl, freebsd: wmctrl-fork}
    - xclip
    - xdotool
    - {name: xmobar, freebsd: hs-xmobar}
    - {name: xmonad, pacman: [xmonad, xmonad-contrib], freebsd: hs-xmonad}
    - {name: xorg-x11-server-Xephyr, pacman: xorg-server-xephyr, freebsd: xephyr}
    - {name: xorg-x11-xdm, pacman: xorg-xdm, freebsd: xdm}
    - {name: xwininfo, pacman: xorg-xwininfo}
    - zathura
    - zathura-pdf-poppler

  pkg_rm_gui:
    all:
    - gnome-software

  # Native Fedora lists: only packages with no Arch or FreeBSD equivalent
  # (or from a Fedora-only third-party repo) live here; each entry says why.
  # Everything portable belongs in pkg/pkg_gui above.
  rpm_gui:
    all:
    # - gnome-shell-extension-tailscale-status
    - claude-desktop-unofficial   # Fedora-only: rpm repo in repo_urls (44)
    # - gnome-shell-extension-search-light
    # - gnome-shell-extension-tailscale-gnome-qs
    # - phosh
    # - phosh-devel
    # - phosh-mobile-settings
    # - poppler-devel
    # - poppler-glib-devel
    - proton-vpn-gnome-desktop   # Fedora-only: Proton rpm repo (rpm_url)
    42: 
    - gnome-session-xsession   # Fedora 42 only (X11 session split out, gone in 43)


  # RPM packages you want to install (fedora-bootc only; see the note above
  # rpm_gui). Same name as anything you'd normally install with `dnf install <name>`
  rpm:
    all:
    - arm-image-installer   # Fedora-only tool (writes Fedora ARM images)
    # - bpftrace
    - gcc-plugin-devel   # Fedora split; plugin headers ship with gcc on Arch/FreeBSD
    - proton-vpn-cli   # Fedora-only: Proton rpm repo (rpm_url); not packaged for Arch/FreeBSD
    # - tlp

    all_x86_64:

    # all_aarch64:
    # - aerc
    # - btop
    # - calc
    # - coreutils
    # - cpan
    # - dysk
    # - fastfetch
    # - firefox
    # - fzf
    # - glab
    # - glances
    # - helm
    # - htop
    # - just
    # - kubernetes-client
    # - moreutils
    # - ncdu
    # - neovim
    # - newsboat
    # - pass
    # - poppler
    # - ranger
    # - ripgrep
    # - ruby
    # - tig
    # - tmux
    # - zenity

  rpm_asahi:
    all_aarch64:


  # Urls to RPMs to download (they are curled)
  # so provide the url
  rpm_url:
    42:
    - https://repo.protonvpn.com/fedora-42-stable/protonvpn-stable-release/protonvpn-stable-release-1.0.3-1.noarch.rpm
    43:
    - https://repo.protonvpn.com/fedora-43-stable/protonvpn-stable-release/protonvpn-stable-release-1.0.3-1.noarch.rpm
    44:
    - https://repo.protonvpn.com/fedora-44-stable/protonvpn-stable-release/protonvpn-stable-release-1.0.3-1.noarch.rpm

  rpm_url_gui:
    all_x86_64:
      - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm

  # RPM packages you want to remove from the image
  rpm_rm_gui:
    all:

  # Build files that need to be removed. If the build is filing about some
  # ephemeral file that exists, put the path here so it get removed in
  # the later build stages
  file_rm:
    all:
    # - /path/to/some/file

  # Runtimes for Flatpaks
  # (Can query with `flatpak list --app --columns=application,runtime`)
  # Really only needed if you plan to build an iso
  flatpaks_runtime:
    all:

  # Flatpaks to be installed
  flatpaks:
    all:
    - com.bitwarden.desktop
    - com.calibre_ebook.calibre
    - io.github.peazip.PeaZip
    - me.timschneeberger.GalaxyBudsClient
    - org.jamovi.jamovi
    - org.pulseaudio.pavucontrol
    - re.sonny.Junction
    - io.github.astralvixen.geforce-infinity
    - io.github.htkhiem.Euphonica
    - ch.protonmail.protonmail-bridge
    - me.proton.Mail

  #Flatpaks to be uninstalled
  flatpaks_rm:
    all:
    # - org.chromium.chromium
  
  services_enable_sys:
    all:

  services_disable_sys_gui:
    all:
    # - display-manager.service

  services_mask_sys:
    all:
    # - gdm.service

  services_enable_user:
    all:
    #- emacs.service

  services_mask_user:
    all:
    - localsearch-3.service
    - localsearch-extract-3.service
    - localsearch-writeback-3.service
    - tracker-miner-fs-3.service
    - tracker-miner-fs-control-3.service
