      - cabal-install
      - gtk-docs
      - libX11-devel
      - libXft-devel
      - libpq-devel
      - mariadb-connector-c-devel
      npm_packages:
      - bash-language-server
      - dockerfile-language-server-nodejs
      - pyright
      - perlnavigator-server
      pip_packages:
      # See https://github.com/Freed-Wu/autotools-language-server/issues/9
      - tree-sitter==0.21.3
      - autotools-language-server
      - feedparser
      - psycopg
      - psycopg_binary
      - numpy
      cargo_packages:
      # https://github.com/guilhermeprokisch/smd
      # - smd
      # - wthrr
      # - youtube-tui
      # - lowfi
      # - sendme
      bin_export:
      - autotools-language-server
      - pyright-langserver
      - perlnavigator
      - clangd
      - R
      - Rscript
      - shellcheck
      - youtube-tui
      - /usr/bin/pandoc
      app_export:
      bin_symlink:
      - podman
      - buildah
      - distrobox
      - strace
      - ltrace
      - bpftrace

