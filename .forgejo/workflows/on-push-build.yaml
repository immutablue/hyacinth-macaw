# on-push-build.yaml - Forgejo CI workflow
#
# Triggered by immutablue's push build (build.yaml) after it completes.
# Rebuilds hyacinth-macaw against the freshly pushed base image.
#
# Required secrets:
#   QUAY_USER     - quay.io username
#   QUAY_TOKEN    - quay.io password/token
#
# SPDX-License-Identifier: AGPL-3.0-or-later

name: Build (on Immutablue push)

on:
  repository_dispatch:
    types: [immutablue-push-build]

jobs:
  build:
    runs-on: linux-amd64
    container:
      image: git.podbielniak.com/zachpodbielniak/build-container:43
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git config --global url."https://git.podbielniak.com/".insteadOf "git@git-ssh.podbielniak.com:"
          git submodule update --init --recursive

      - name: Pre-test (shellcheck)
        run: make check

      - name: Login to quay.io
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          buildah login \
              -u "${QUAY_USER}" \
              -p "${QUAY_TOKEN}" \
              quay.io

      - name: Build image
        run: make build

      - name: Push image
        run: make push
