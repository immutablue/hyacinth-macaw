[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom7]
binding='<Control><Alt>8'
command="/bin/bash -c 'source $HOME/.bashrc && hass-cli service call switch.toggle --arguments entity_id=switch.d8_47_32_9e_e9_15'"
name='Toggle Server Room'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom8]
binding='<Control><Alt>9'
command="/bin/bash -c 'source $HOME/.bashrc && hass-cli service call switch.toggle --arguments entity_id=switch.b4_b0_24_29_80_df'"
name='Toggle Fan-01'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom9]
binding='<Control><Alt>0'
