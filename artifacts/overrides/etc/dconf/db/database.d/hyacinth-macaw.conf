name='Toggle Can Right'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom12]
binding='<Alt>f'
command='gnome-terminal -- distrobox-enter ephem-fedora'
name='Ephem-Fedora'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom13]
binding='<Alt>u'
command='gnome-terminal -- distrobox-enter ephem-ubuntu'
name='Ephem-Ubuntu'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom14]
binding='<Alt>r'
command='gnome-terminal -- distrobox-enter ephem-rhel'
name='Ephem-Rhel'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom15]
binding='<Alt>a'
command='gnome-terminal -- distrobox-enter ephem-arch'
name='Ephem-Arch'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom16]
binding='AudioPlay'
command='/usr/bin/distrobox-enter mpd -- mpc toggle'
name='Media-PausePlay'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom17]
binding='<Shift><Alt>a'
command='gnome-terminal -- distrobox-enter ephem-alpine'
name='Ephem-Alpine'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom18]
binding='<Shift><Alt>r'
command='gnome-terminal -- distrobox-enter ephem-ubi'
name='Ephem-Ubi'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom19]
binding='<Shift><Alt>c'
command='gnome-terminal -- bash -c "source $HOME/.bashrc >/dev/null && canned_response"'
name='Canned Response'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom20]
binding='<Alt>m'
command='gnome-terminal -- ncmpcpp'
name='ncmpcpp'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom21]
binding='<Alt>p'
command='/bin/bash -c "source $HOME/.bashrc && mpc toggle"'
name='mpc toggle'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom22]
binding='<Shift><Alt>period'
command='/bin/bash -c "source $HOME/.bashrc && mpc next"'
name='mpc next'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom23]
binding='<Shift><Alt>comma'
command='/bin/bash -c "source $HOME/.bashrc && mpc prev"'
name='mpc prev'

