# This modprobe conf is part of the Hyacinth Macaw project (part of Immutablue).
# Please see https://gitlab.com/immutablue/hyacinth-macaw for more details
#
#
# Set the wireless regulatory domain to US at module load. Without it the
# kernel stays on the world domain (country 00 / DFS-UNSET), which disables
# every 6 GHz channel -- and the Steam Frame wireless adapter (28de:2432,
# rtw89_8852cu) is a 6 GHz SoftAP, so it never pairs.
options cfg80211 ieee80211_regdom=US
